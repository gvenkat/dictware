[project]
name = "dictware"
version = "0.1.0"
description = "Ruby-inspired helpers for working with Python dicts"
readme = "README.md"
authors = [
    { name = "Venkatakrishnan Ganesh", email = "superpulse.x@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.10",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]